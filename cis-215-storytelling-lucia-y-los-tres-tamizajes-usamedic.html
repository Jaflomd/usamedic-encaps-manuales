<style>

.decision .feedback.bad{background:rgba(239,68,68,.16);border-left:4px solid var(--danger)}
.scene-content.dark-text .decision .feedback.ok{background:rgba(16,185,129,.12)}
.scene-content.dark-text .decision .feedback.bad{background:rgba(239,68,68,.08)}

.scene-inner table{width:100%;border-collapse:collapse;margin:16px 0;font-family:var(--font-body);font-size:.88rem;border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);background:rgba(0,0,0,.3)}
.scene-content.dark-text table{background:rgba(255,255,255,.65)}
.scene-inner thead{background:linear-gradient(135deg,rgba(29,202,211,.5),rgba(42,125,225,.5))}
.scene-content.dark-text thead{background:linear-gradient(135deg,#1DCAD3,#2A7DE1)}
.scene-inner thead th{padding:10px 13px;text-align:left;font-weight:600;font-size:.78rem;letter-spacing:.5px;text-shadow:none}
.scene-content.dark-text thead th{color:#fff}
.scene-inner tbody td{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:400;vertical-align:top;text-shadow:none}
.scene-content.dark-text tbody td{border-color:rgba(26,43,60,.08)}

.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.rcard{padding:16px 12px;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(10px);transition:.25s}
.rcard:hover{transform:translateY(-3px);background:rgba(0,0,0,.4)}
.rcard .silhouette{width:38px;height:48px;margin:0 auto 7px}
.rcard .n{font-family:var(--font-brand);font-weight:700;font-size:.82rem;text-shadow:none}
.rcard .r{font-size:.68rem;opacity:.78;margin-top:2px;font-weight:300;text-shadow:none}

.qbank-q{margin-bottom:22px;padding:20px 22px;background:rgba(255,255,255,.55);border-radius:14px;border:1px solid rgba(26,43,60,.08);box-shadow:0 4px 12px rgba(26,43,60,.06)}
.qbank-q .stem{font-family:var(--font-display);font-weight:500;font-size:1rem;margin-bottom:12px;line-height:1.5}
.qbank-q .stem .num{font-weight:700;color:var(--primary);margin-right:5px}
.qbank-q .stem .star{color:var(--warning);margin-left:5px}
.qbank-q .options{display:flex;flex-direction:column;gap:9px;margin:10px 0 0}

.qbank-q .opt.correct{border-color:var(--success);background:rgba(16,185,129,.18);color:#065f46;font-weight:500}

.qbank-q .feedback{margin-top:14px;padding:14px 16px;border-radius:10px;font-size:.9rem;line-height:1.6;animation:fadeUp .3s}
.qbank-q .feedback.ok{background:rgba(16,185,129,.12);border-left:4px solid var(--success);color:#065f46}

.qbank-q .meta-row{display:flex;justify-content:space-between;margin-top:10px;font-size:.72rem;opacity:.7;font-style:italic}

.usamedic-footer{margin-top:24px;padding:24px 22px;background:rgba(5,10,21,.05);color:var(--dark);text-align:center;border-top:1px solid rgba(26,43,60,.1);border-radius:12px}

.hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(5,10,21,.7);color:#fff;padding:7px 14px;border-radius:999px;font-size:.72rem;font-family:var(--font-body);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);z-index:140;animation:hintFade 4.5s ease-out forwards;pointer-events:none}

}

const Slide = ({ index, active, sky, mountainColors, foregroundColor, sun, withRain, withStars, withPeople, darkText, children }) => {
  const distantRef = useRef(null);
  const midRef = useRef(null);
  const nearRef = useRef(null);
  const foreRef = useRef(null);
  const sunRef = useRef(null);

  useEffect(() => {
    if (!active) return;
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      if (distantRef.current) distantRef.current.style.transform = `translate3d(${x * -8}px, ${y * -4}px, 0)`;
      if (midRef.current) midRef.current.style.transform = `translate3d(${x * -18}px, ${y * -8}px, 0)`;
      if (nearRef.current) nearRef.current.style.transform = `translate3d(${x * -30}px, ${y * -12}px, 0)`;
      if (foreRef.current) foreRef.current.style.transform = `translate3d(${x * -45}px, ${y * -18}px, 0)`;
      if (sunRef.current) sunRef.current.style.transform = `translate3d(${x * -4}px, ${y * -2}px, 0)`;
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, [active]);

  return (
    <section className={`slide ${active ? "active" : ""}`} data-index={index}>
      <div className="sky" style={{background: SKIES[sky]}}/>
      {sun && (
        <div ref={sunRef} className="celestial" style={{
          width: sun.size, height: sun.size,
          background: sun.color,
          top: sun.top, left: sun.left,
          boxShadow: sun.glow ? `0 0 ${sun.size * 0.7}px ${sun.color}66` : "none",
          opacity: sun.opacity || 1,
        }}/>
      )}
      {withStars && (
        <div className="stars-layer">
          {[...Array(70)].map((_, i) => (
            <span key={i} className="star" style={{
              top: `${Math.random()*65}%`, left: `${Math.random()*100}%`,
              animationDuration: `${2 + Math.random()*4}s`,
              animationDelay: `${Math.random()*3}s`,
              width: `${1 + Math.random()*1.5}px`,
              height: `${1 + Math.random()*1.5}px`,
            }}/>
          ))}
        </div>
      )}
      {withRain && (
        <div className="rain-layer">
          {[...Array(45)].map((_, i) => (
            <span key={i} className="raindrop" style={{
              left: `${Math.random()*100}%`,
              animationDuration: `${0.5 + Math.random()*0.7}s`,
              animationDelay: `${Math.random()*1.5}s`,

      <div ref={foreRef} className="layer fore"><Foreground color={foregroundColor} withPeople={withPeople}/></div>
      <div className={`scene-content ${darkText ? "dark-text" : ""}`}>

    </section>
  );
};

const Decision = ({ question, options, correct, explainOk, explainBad }) => {
  const [picked, setPicked] = useState(null);
  return (
    <div className="decision">
      <p className="q">{question}</p>
      <div className="options">
        {options.map((o, i) => {
          let cls = "opt";
          if (picked !== null) {
            cls += " locked";
            if (i === correct) cls += " correct";
            else if (i === picked) cls += " wrong";
          }
          return (
            <button key={i} className={cls}
              onClick={() => picked === null && setPicked(i)}>
              <strong>{String.fromCharCode(65 + i)}.</strong> {o}
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`feedback ${picked === correct ? "ok" : "bad"}`}>
          {picked === correct ? explainOk : explainBad}
        </div>
      )}
    </div>
  );
};

    const next = Math.max(0, Math.min(total - 1, n));
    if (next !== idx) {
      setIdx(next);
      requestAnimationFrame(() => {
        document.querySelectorAll(".scene-content").forEach(el => el.scrollTop = 0);

      else if (e.key === "End") { e.preventDefault(); go(total - 1); }
    };

    return () => window.removeEventListener("keydown", onKey);
  }, [idx]);

            </div>
            <Character who="luci" level="n2">
              Lucía cumple criterios ambulatorios: T baja, sin absceso, tolera VO, no embarazada. Receta el esquema, cita en 72 h.
            </Character>
          </Slide>

          {/* SLIDE 3 — Tres tiras */}
          <Slide index={3} active={idx === 3} {...SCENES[3]}>
            <p className="eyebrow">Capítulo III · 9:10 a.m.</p>
            <h1>Treinta minutos <em>después</em></h1>
            <p className="narration">
              Lucía sale al pasillo. Vuelve. Te inclinas sobre las tres tiras.
            </p>
            <div className="callout trap">
              <h4>Resultados PRD + HBsAg</h4>
              <p><strong>VIH:</strong> no reactivo. &nbsp;·&nbsp; <strong>Sífilis:</strong> reactiva. &nbsp;·&nbsp; <strong>HBsAg:</strong> reactiva.</p>
              <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:"1.05rem",marginTop:"6px"}}>Dos de tres.</p>
            </div>
            <p className="narration">
              Lucía nunca tuvo una prueba de sífilis. No conoce su estado de vacuna Hep B.
              Tu mente repasa: <em>same day testing, same day treatment</em> aplica a ITS también.
            </p>
            <Character who="norma" level="n2">
              NTS 240, p. 9: en todo síndrome ITS, las pruebas rápidas se ofrecen el mismo día y el tratamiento se inicia con el resultado reactivo, sin esperar confirmatorias.
            </Character>
            <Character who="luci" level="n2">
              Plan: sífilis → 3 dosis PNC benzatínica semanales (latente desconocida). Hep B → marcadores completos + referir. VIH negativo → consejería preventiva y considerar PrEP si su pareja es de riesgo.
            </Character>
          </Slide>

          {/* SLIDE 4 — Rama sífilis */}
          <Slide index={4} active={idx === 4} {...SCENES[4]}>
            <p className="eyebrow">Capítulo IV · Rama sífilis</p>
            <h1>La dosis que cuesta <em>cinco soles</em></h1>
            <p className="narration">
              PRD-sífilis reactiva. RPR cuantitativo no llega antes de 7 días.
              Sin lesión activa, sin historia previa = <em>latente de duración desconocida</em>.
            </p>
            <div className="callout rule">
              <h4>Conducta hoy</h4>
              <ol>
                <li>PNC-G benzatínica <code>2.4 MUI IM</code> hoy, 1ra de 3 dosis semanales.</li>
                <li>Solicitar RPR cuantitativo y FTA-ABS o TPHA.</li>
                <li>Notificar a pareja (Mario, 26a) → tamizaje y tratamiento.</li>
                <li>Seguimiento RPR cuantitativo a 3, 6, 12 meses (caída ≥4× = respuesta).</li>
              </ol>
              <p style={{marginTop:"8px"}}>NTS 159-2019, p. 43-44; NTS 240, p. 25.</p>
            </div>
            <Character who="lucia">
              Doctor, ¿le digo a Mario? ¿Y si se molesta?
            </Character>
            <Character who="serums">
              Le explicas la regla 4C: Mario también necesita prueba y tratamiento; si no, en dos meses regresa la sífilis a Lucía. El acompañamiento del SERUMS hace toda la diferencia.
            </Character>
            <div className="callout trap">
              <h4>Trampas clásicas (no gestante)</h4>
              <ul>
                <li><strong>Confundir RPR con FTA-ABS</strong> en seguimiento → FTA-ABS reactivo de por vida, no sirve para evaluar respuesta.</li>
                <li><strong>1 dosis para duración desconocida</strong> → reactivación / fracaso.</li>
                <li><strong>Eritromicina en sífilis</strong> → no es estándar (válido solo en escenarios muy restringidos; gestante = PNC SIEMPRE).</li>
                <li><strong>Suspender porque PRD es treponémica</strong> → la PRD es válida como tamizaje y dispara tratamiento.</li>
              </ul>
            </div>
            <Decision
              question="¿Y si Lucía estuviera embarazada de 18 semanas?"
              options={[
                "Doxiciclina 100 mg c/12h x 28d.",
                "Eritromicina 500 mg c/6h x 14d.",
                "PNC-G benzatínica 2.4 MUI IM x 3 dosis semanales, comenzar hoy. Si alérgica → desensibilizar.",
                "Esperar al 3er trimestre para tratar.",
              ]}
              correct={2}
              explainOk="Correcto. Gestante = PNC SIEMPRE. Doxiciclina contraindicada. Eritromicina no cruza placenta en dosis treponemicidas → sífilis congénita. Alergia → desensibilizar; última opción: ceftriaxona 14d. NTS 159, p. 44."
              explainBad="Trampa de ENAM. En gestante: doxiciclina y eritromicina están fuera. PNC siempre, desensibilizar si alérgica. NTS 159, p. 44."
            />
          </Slide>

          {/* SLIDE 5 — VIH definición + Hep B/C */}
          <Slide index={5} active={idx === 5} {...SCENES[5]}>
            <p className="eyebrow">Capítulo V · Las otras dos ramas</p>
            <h1>VIH negativo, <em>Hep B reactiva</em></h1>
            <Character who="luci" level="n2">
              Definición de caso VIH: 2 PR reactivas de distinto fabricante, o 1 PR + ELISA, o 1 PR + confirmatoria. Solo entonces se inicia TAR.
            </Character>
            <table>
              <thead><tr><th>Esquema</th><th>Dosis</th><th>Uso</th></tr></thead>
              <tbody>
                <tr><td><strong>TDF/3TC/DTG (DFC)</strong></td><td>1 tab c/24h</td><td>1ra línea adulto · independiente de CD4/CV</td></tr>
                <tr><td>TDF/3TC/EFV 400</td><td>1 tab c/24h</td><td>Alternativa si DTG contraindicado</td></tr>
                <tr><td>TDF/FTC/EFV 600</td><td>1 tab c/24h</td><td>Alternativa</td></tr>
              </tbody>
            </table>
            <Character who="norma" level="n2">
              NT VIH, p. 26-27: TAR inmediato, sin esperar CD4/CV. Si TB activa: tratar TB primero e iniciar TAR 2-8 semanas después. Coinfección VHB: TDF + 3TC obligatorio (acción dual).
            </Character>
            <div className="callout rule">
              <h4>Hepatitis B en Lucía (no gestante)</h4>
              <ol>
                <li>HBsAg(+) → marcadores completos: HBeAg, Anti-HBc IgM/Total, CV-VHB.</li>
                <li>Tamizar Anti-VHC (PCR si reactivo).</li>
                <li>Referir a infectología para definir aguda vs crónica.</li>
                <li>Tratamiento (TDF/Entecavir) según criterios de cronicidad activa, no automático.</li>
                <li>Consejería: condón, no compartir agujas/objetos cortantes, vacuna a pareja/convivientes si susceptibles.</li>
              </ol>
              <p style={{marginTop:"8px"}}>NTS 146-2018 · NTS 145-2018 (Hep C).</p>
            </div>
            <div className="callout trap">
              <h4>Pepa clave (vs PTMI)</h4>
              <p>En <em>no gestante</em>, HBsAg(+) NO desencadena IGHB ni vacuna inmediata; eso es para el RN expuesto. Aquí prima caracterizar marcadores antes de tratar.</p>
            </div>
          </Slide>

          {/* SLIDE 6 — Pareja y 4C */}
          <Slide index={6} active={idx === 6} {...SCENES[6]}>
            <p className="eyebrow">Capítulo VI · La pareja</p>
            <h1>Mario llega <em>esa noche</em></h1>
            <p className="narration">
              A las 19:40, Mario aparece. Lucía le contó. Tiene 26 años, trabaja en construcción.
              Última prueba VIH: hace tres años, negativa. Sin condón en los últimos 8 meses.
            </p>
            <Character who="pareja">
              Doctor, ¿yo también puedo tener? Tengo miedo. Pero también tengo trabajo mañana a las seis.
            </Character>
            <Character who="luci" level="n2">
              Regla 4C — Consejería + Cumplimiento + Contactos + Condones. Mario es contacto sexual: tamizar PRD/PRT hoy, tratar empíricamente sífilis (1 dosis si latente temprana posible) y considerar PrEP/PPE si exposición de riesgo reciente.
            </Character>
            <div className="callout rule">
              <h4>PrEP vs PPE — decisión rápida</h4>
              <table>
                <thead><tr><th>Variable</th><th>PrEP</th><th>PPE</th></tr></thead>
                <tbody>
                  <tr><td>Exposición de riesgo en últimas 72h</td><td>NO</td><td>SÍ</td></tr>
                  <tr><td>Esquema</td><td>TDF/FTC 1 tab/día (diaria) o 2-1-1 (a demanda HSH)</td><td>TDF/3TC/DTG x 4 semanas</td></tr>
                  <tr><td>Población</td><td>HSH, MT, TS, parejas serodiscordantes ≥18a</td><td>Violencia sexual / exposición alto riesgo</td></tr>
                  <tr><td>Seguimiento</td><td>PR VIH + creatinina + ITS al mes y c/3 meses</td><td>VIH 6 sem, 3m, 6m</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"8px"}}>NTS 204-2023, p. 10-16.</p>
            </div>
            <div className="callout gold">
              <h4>La regla 4C — en cada visita ITS</h4>
              <ul>
                <li><strong>Consejería:</strong> historia sexual, riesgo, expectativas, modo de transmisión.</li>
                <li><strong>Cumplimiento:</strong> entregar lista de medicamentos, fechas, signos de alarma.</li>
                <li><strong>Contactos:</strong> trazar pareja(s) en últimos 60-90 días según síndrome.</li>
                <li><strong>Condones:</strong> entregar paquete inicial + lubricante; demostrar uso.</li>
              </ul>
              <p style={{marginTop:"8px"}}>NTS 240, p. 25.</p>
            </div>
          </Slide>

          {/* SLIDE 7 — Cierre */}
          <Slide index={7} active={idx === 7} {...SCENES[7]}>
            <p className="eyebrow">Cierre · Seis meses después</p>
            <h1>RPR cae a <em>1:2</em>. La pareja, vinculada.</h1>
            <p className="narration">
              Lucía completó sus 3 dosis de PNC. RPR de seguimiento: caída de 1:32 → 1:2 a los 6 meses → respuesta adecuada.
              Marcadores Hep B definieron portadora crónica con CV baja → seguimiento sin TDF inicial.
              Anti-VHC negativo. Mario: PR negativa, sífilis tratada profilácticamente, condones en uso.
            </p>
            <div className="callout gold">
              <h4>La regla de oro · ITS-VIH-Hepatitis</h4>
              <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:"1.05rem"}}>
                Tratamiento sindrómico el mismo día · tamizaje universal de los tres virus · regla 4C en cada visita.
              </p>
              <table style={{marginTop:"12px"}}>
                <thead><tr><th>Norma</th><th>Cubre</th><th>Año</th></tr></thead>
                <tbody>
                  <tr><td>NTS 240</td><td>ITS, abordaje sindrómico</td><td>2026</td></tr>
                  <tr><td>NTS 169</td><td>VIH adulto, coinfección TB/VIH</td><td>2020</td></tr>
                  <tr><td>NTS 159</td><td>PTMI (VIH + sífilis + Hep B)</td><td>2019</td></tr>
                  <tr><td>NTS 204</td><td>Prevención combinada VIH (PrEP/PPE)</td><td>2023</td></tr>
                  <tr><td>NTS 146 / 145</td><td>Hepatitis B / Hepatitis C</td><td>2018</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"12px",fontStyle:"italic"}}>
                Una consulta sindrómica que se hace bien rompe tres cadenas de transmisión a la vez.
              </p>
            </div>
          </Slide>

          {/* SLIDE 8 — Q-Bank */}
          <Slide index={8} active={idx === 8} {...SCENES[8]}>
            <p className="eyebrow" style={{color:"var(--primary)"}}>Epílogo · Q-Bank ENAM</p>
            <h1>Seis preguntas, <em>en frío</em></h1>
            <p className="narration">
              Después de vivir el caso de Lucía, las preguntas pesan distinto.
              Resuelve. Recibes feedback inmediato con la norma exacta.
            </p>
            {QBANK.map((q, i) => <QBankItem key={i} q={q} idx={i} />)}
            <div className="callout">
              <h4>Reglas de seguridad para clase</h4>
              <ul>
                <li><code>source_gated · tema_delimitado</code>. No conviertas dosis o plazos en MCQ sin claim aprobado contra fuente A.</li>
                <li>Separar ITS / VIH / Hep B-C / PTMI / prevención combinada en stems distintos.</li>
                <li>Toda dosis específica en gestante = NTS 159; en no gestante = NTS 240 / NT VIH.</li>
              </ul>
            </div>
            <div className="usamedic-footer">
              <img src="data:image/png;base64,__LOGO_B64__" alt="USAMEDIC · Médicos de Excelencia"/>
              <div className="tagline">Preparación Residentado Médico · ENAM · Internado</div>
              <div className="links">
                <a href="https://www.usamedic.pe">usamedic.pe</a> ·
                <a href="https://facebook.com/usamedic">Facebook</a> ·
                <a href="https://instagram.com/usamedic">Instagram</a> ·
                <a href="https://youtube.com/usamedic">YouTube</a>
              </div>
              <div className="sub">
                CIS-2.15 · ITS · VIH · Hep B/C · Storytelling cinematográfico · Dreyfus N1+N2+N3
              </div>
            </div>
          </Slide>

        </div>
      </div>

      {showHint && (
        <div className="hint">← → o desliza para navegar · ↓ para leer más dentro de cada capítulo</div>
      )}

      <div className="bottom-nav">
        <button className="nav-arrow" onClick={() => go(idx - 1)} disabled={idx === 0} aria-label="Anterior">←</button>
        <div className="dots">
          {SCENES.map((s, i) => (
            <button key={i} className={`dot ${i === idx ? "active" : ""}`}
              onClick={() => go(i)} aria-label={s.label}>
              <span className="tip">{s.label}</span>
            </button>
          ))}
        </div>
        <button className="nav-arrow" onClick={() => go(idx + 1)} disabled={idx === total - 1} aria-label="Siguiente">→</button>
      </div>
    </Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
