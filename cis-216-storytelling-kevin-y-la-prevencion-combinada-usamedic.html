const Slide = ({ index, active, sky, mountainColors, foregroundColor, sun, withRain, withStars, withPeople, darkText, children }) => {
  const distantRef = useRef(null);
  const midRef = useRef(null);
  const nearRef = useRef(null);
  const foreRef = useRef(null);
  const sunRef = useRef(null);

  useEffect(() => {
    if (!active) return;
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      if (distantRef.current) distantRef.current.style.transform = `translate3d(${x * -8}px, ${y * -4}px, 0)`;
      if (midRef.current) midRef.current.style.transform = `translate3d(${x * -18}px, ${y * -8}px, 0)`;
      if (nearRef.current) nearRef.current.style.transform = `translate3d(${x * -30}px, ${y * -12}px, 0)`;
      if (foreRef.current) foreRef.current.style.transform = `translate3d(${x * -45}px, ${y * -18}px, 0)`;
      if (sunRef.current) sunRef.current.style.transform = `translate3d(${x * -4}px, ${y * -2}px, 0)`;
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, [active]);

  return (
    <section className={`slide ${active ? "active" : ""}`} data-index={index}>
      <div className="sky" style={{background: SKIES[sky]}}/>
      {sun && (
        <div ref={sunRef} className="celestial" style={{
          width: sun.size, height: sun.size,
          background: sun.color,
          top: sun.top, left: sun.left,
          boxShadow: sun.glow ? `0 0 ${sun.size * 0.7}px ${sun.color}66` : "none",
          opacity: sun.opacity || 1,
        }}/>
      )}
      {withStars && (
        <div className="stars-layer">
          {[...Array(70)].map((_, i) => (
            <span key={i} className="star" style={{
              top: `${Math.random()*65}%`, left: `${Math.random()*100}%`,
              animationDuration: `${2 + Math.random()*4}s`,
              animationDelay: `${Math.random()*3}s`,
              width: `${1 + Math.random()*1.5}px`,
              height: `${1 + Math.random()*1.5}px`,
            }}/>
          ))}
        </div>
      )}
      {withRain && (
        <div className="rain-layer">
          {[...Array(45)].map((_, i) => (
            <span key={i} className="raindrop" style={{
              left: `${Math.random()*100}%`,
              animationDuration: `${0.5 + Math.random()*0.7}s`,
              animationDelay: `${Math.random()*1.5}s`,

            }}/>

      <div ref={distantRef} className="layer distant"><Mountains variant="distant" color={mountainColors[0]} /></div>
      <div ref={midRef} className="layer mid"><Mountains variant="mid" color={mountainColors[1]} /></div>
      <div ref={nearRef} className="layer near"><Mountains variant="near" color={mountainColors[2]} /></div>
      <div ref={foreRef} className="layer fore"><Foreground color={foregroundColor} withPeople={withPeople}/></div>
      <div className={`scene-content ${darkText ? "dark-text" : ""}`}>

    </section>
  );
};

const Decision = ({ question, options, correct, explainOk, explainBad }) => {
  const [picked, setPicked] = useState(null);
  return (
    <div className="decision">
      <p className="q">{question}</p>
      <div className="options">
        {options.map((o, i) => {
          let cls = "opt";
          if (picked !== null) {
            cls += " locked";
            if (i === correct) cls += " correct";
            else if (i === picked) cls += " wrong";
          }
          return (
            <button key={i} className={cls}
              onClick={() => picked === null && setPicked(i)}>
              <strong>{String.fromCharCode(65 + i)}.</strong> {o}
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`feedback ${picked === correct ? "ok" : "bad"}`}>
          {picked === correct ? explainOk : explainBad}
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [idx, setIdx] = useState(0);
  const [showHint, setShowHint] = useState(true);
  const total = SCENES.length;
  const touchStart = useRef(null);

  const go = (n) => {
    const next = Math.max(0, Math.min(total - 1, n));
    if (next !== idx) {
      setIdx(next);
      requestAnimationFrame(() => {
        document.querySelectorAll(".scene-content").forEach(el => el.scrollTop = 0);
      });
    }
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(idx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
      else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(total - 1); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [idx]);

  useEffect(() => {
    const t = setTimeout(() => setShowHint(false), 5000);
    return () => clearTimeout(t);
  }, []);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current === null) return;
    const delta = e.changedTouches[0].clientX - touchStart.current;
    if (Math.abs(delta) > 60) {
      if (delta < 0) go(idx + 1); else go(idx - 1);
    }
    touchStart.current = null;
  };

  return (
    <Fragment>
      <div className="counter">{String(idx + 1).padStart(2,"0")} / {String(total).padStart(2,"0")} · {SCENES[idx].label}</div>

            <Character who="luci" level="n2">
              Hay dos modalidades. La diaria sirve para todos. La a-demanda (2-1-1) es <em>solo</em> para HSH
              con relaciones infrecuentes y planificables, y <em>está contraindicada en hepatitis B crónica</em>.
            </Character>
            <table>
              <thead><tr><th>Modalidad</th><th>Esquema</th><th>Indicación</th></tr></thead>
              <tbody>
                <tr><td><strong>PrEP diaria</strong></td><td>TDF/FTC 300/200 mg · 1 tab c/24h</td><td>HSH · MT · TS · parejas serodiscordantes</td></tr>
                <tr><td><strong>PrEP 2-1-1</strong></td><td>2 tab 2-24h antes · 1 tab a las 24h · 1 tab a las 48h post</td><td>Solo HSH con relaciones ≤2/sem planificables</td></tr>
              </tbody>
            </table>
            <div className="callout trap">
              <h4>Trampa de la PrEP a demanda</h4>
              <p>Contraindicada en Hep B crónica: al suspender TDF de forma intermitente puede reactivar hepatitis. Antes de 2-1-1, descartar HBsAg(+). NTS 204, p. 13.</p>
            </div>
            <div className="callout rule">
              <h4>Interacciones — qué SÍ y qué NO</h4>
              <ul>
                <li>NO afecta anticonceptivos hormonales.</li>
                <li>NO interacciona con terapia hormonal (trans).</li>
                <li>NO interacciona con alcohol ni sustancias psicoactivas.</li>
                <li>Vigilar función renal (CrCl) cada visita.</li>
              </ul>
              <p style={{marginTop:"8px"}}>NTS 204, p. 13-15.</p>
            </div>
          </Slide>

          <Slide index={4} active={idx === 4} {...SCENES[4]}>
            <p className="eyebrow">Capítulo IV · Rama PPE · Diego</p>
            <h1>Diego entra <em>asustado</em></h1>
            <p className="narration">
              22:10. Diego, 28 años, amigo de Kevin. Hace 36 horas tuvo relación sexual no consentida.
              Trae el reporte policial. PR VIH negativa hoy.
            </p>
            <Character who="amigo">
              No quiero pensar lo que pasó. Solo dime si todavía estoy a tiempo.
            </Character>
            <Character who="luci" level="n2">
              36 horas. Aún dentro de las 72 horas. PPE indicada. El reloj corre: cada hora que pasa
              después de 72 reduce la eficacia. No esperes resultados confirmatorios para iniciar.
            </Character>
            <div className="callout rule">
              <h4>PPE — esquema de elección (4 semanas)</h4>
              <table>
                <thead><tr><th>Esquema</th><th>Dosis</th></tr></thead>
                <tbody>
                  <tr><td><strong>TDF/3TC/DTG</strong> (1ra)</td><td>1 tab TDF/3TC c/24h + DTG 50 mg c/24h</td></tr>
                  <tr><td>TDF/FTC + DRV 800 + rtv 100</td><td>Según tabla</td></tr>
                  <tr><td>TDF/FTC + LPV/rtv</td><td>Solo si no hay anteriores</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"8px"}}>NTS 204, p. 16.</p>
            </div>
            <div className="callout gold">
              <h4>Paquete violencia sexual (NTS 204 p. 15)</h4>
              <ol>
                <li><strong>Tamizaje:</strong> VIH · sífilis · Hep B · Hep C · embarazo.</li>
                <li><strong>PPE VIH:</strong> TDF/3TC/DTG x 4 sem.</li>
                <li><strong>Profilaxis ITS:</strong> Ceftriaxona 500 mg IM DU + Azitromicina 1 g VO DU + PNC benz 2.4 MUI IM DU.</li>
                <li><strong>Anticoncepción de emergencia</strong> (si aplica).</li>
                <li><strong>Vacuna Hep B</strong> + IGHB 0.06 ml/kg IM si susceptible (preferible &lt;48h).</li>
                <li><strong>Seguimiento serológico:</strong> VIH 6 sem, 3 y 6 meses; sífilis a las 6 semanas.</li>
                <li><strong>Activar ruta de protección</strong> y soporte psicológico.</li>
              </ol>
            </div>
          </Slide>

          <Slide index={5} active={idx === 5} {...SCENES[5]}>
            <p className="eyebrow">Capítulo V · PrEP vs PPE · decisión rápida</p>
            <h1>72 horas, <em>la línea</em></h1>
            <p className="narration">
              La misma molécula (TDF) sostiene dos lógicas opuestas: antes (PrEP) y después (PPE).
              Confundirlas tiene consecuencias clínicas serias.
            </p>
            <table>
              <thead><tr><th>Variable</th><th>PrEP</th><th>PPE</th></tr></thead>
              <tbody>
                <tr><td>Exposición &lt;72h</td><td>NO debe haber</td><td>SÍ es el disparador</td></tr>
                <tr><td>Duración</td><td>Continua mientras haya riesgo</td><td>4 semanas exactas</td></tr>
                <tr><td>Esquema</td><td>TDF/FTC</td><td>TDF/3TC/DTG (3 fármacos)</td></tr>
                <tr><td>Edad</td><td>≥18 años (norma peruana)</td><td>Cualquier edad con exposición</td></tr>
                <tr><td>Seguimiento</td><td>1m, luego c/3m con CrCl + ITS</td><td>VIH a 6 sem, 3m, 6m</td></tr>
                <tr><td>Si infección aguda</td><td>Contraindicada → cambiar a TAR</td><td>Convertir a TAR si seroconversión</td></tr>
              </tbody>
            </table>
            <Character who="norma" level="n3">
              Trampa de examen: paciente con exposición de riesgo &lt;72h → PPE, no PrEP. Si se inicia PrEP
              en infección aguda no detectada se generan resistencias. NTS 204, p. 10-16.
            </Character>
          </Slide>

          <Slide index={6} active={idx === 6} {...SCENES[6]}>
            <p className="eyebrow">Capítulo VI · Seguimiento y poblaciones clave</p>
            <h1>El que no se sigue, <em>se pierde</em></h1>
            <div className="callout rule">
              <h4>Seguimiento PrEP — NTS 204 p. 13</h4>
              <ul>
                <li>Cita al <strong>1 mes</strong>: PR VIH + adherencia + tolerancia.</li>
                <li>Luego <strong>cada 3 meses</strong>: PR VIH + creatinina + tamizaje ITS + entrega de insumos.</li>
                <li>Verificar Hep B; revacunar si Anti-HBs &lt; 10 UI/mL.</li>
                <li>Si seroconversión: pasar a TAR estándar de inmediato.</li>
              </ul>
            </div>
            <div className="callout rule">
              <h4>Seguimiento PPE</h4>
              <ul>
                <li>Iniciar HOY, no esperar resultados.</li>
                <li>VIH a las <strong>6 semanas, 3 meses y 6 meses</strong>.</li>
                <li>Sífilis a las 6 semanas.</li>
                <li>Si convierte: pasar a TAR + estudio confirmatorio.</li>
              </ul>
              <p style={{marginTop:"8px"}}>NTS 204, p. 16.</p>
            </div>
            <Character who="luci" level="n3">
              Población clave no es etiqueta — es estrategia. La epidemia VIH en Perú está concentrada
              en HSH/MT/TS. Donde hay cascada de prevención completa, la incidencia cae.
            </Character>
            <Character who="kevin">
              Doctor, vengo cada 3 meses sin falta. Y traigo a mis amigos cuando puedo.
            </Character>
          </Slide>

          <Slide index={7} active={idx === 7} {...SCENES[7]}>
            <p className="eyebrow">Cierre · Doce meses después</p>
            <h1>Cero seroconversiones <em>en el grupo</em></h1>
            <p className="narration">
              Kevin lleva 12 meses en PrEP diaria. PR VIH siempre negativa. Trajo a tres amigos.
              Diego completó las 4 semanas de PPE, seroconversión negativa a 6 meses. Vacuna Hep B
              completa. Ambos usan condón en relaciones casuales como respaldo.
            </p>
            <div className="callout gold">
              <h4>La regla de oro · prevención combinada</h4>
              <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:"1.05rem"}}>
                Antes de la exposición → PrEP. Después y &lt;72h → PPE. Siempre tamizar, vacunar, entregar condón y aplicar 4C.
              </p>
              <table style={{marginTop:"12px"}}>
                <thead><tr><th>Estrategia</th><th>Reducción aproximada del riesgo VIH</th></tr></thead>
                <tbody>
                  <tr><td>Condón consistente</td><td>~80%</td></tr>
                  <tr><td>PrEP diaria con adherencia alta</td><td>&gt;95%</td></tr>
                  <tr><td>PPE iniciada &lt;72h</td><td>~80%</td></tr>
                  <tr><td>TasP (CV indetectable)</td><td>Cercano a 100% vía sexual</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"12px",fontStyle:"italic"}}>
                Cada herramienta sola es buena. Combinadas, cierran la ventana.
              </p>
            </div>
          </Slide>

          <Slide index={8} active={idx === 8} {...SCENES[8]}>
            <p className="eyebrow" style={{color:"var(--primary)"}}>Epílogo · Q-Bank ENAM</p>
            <h1>Seis preguntas, <em>en frío</em></h1>
            <p className="narration">
              Después de Kevin y Diego, las preguntas tienen peso. La frontera de 72h
              es el bisturí: define todo lo que sigue.
            </p>
            {QBANK.map((q, i) => <QBankItem key={i} q={q} idx={i} />)}
            <div className="callout">
              <h4>Reglas de seguridad para clase</h4>
              <ul>
                <li><code>source_gated · tema_delimitado</code>. NTS 204 marca el paquete; no mezcles PTMI/RN expuesto con prevención combinada.</li>
                <li>PrEP requiere edad ≥18, VIH(-) hoy, CrCl ≥60, sin exposición &lt;72h.</li>
                <li>Violencia sexual = paquete integral, no PPE aislada.</li>
              </ul>
            </div>
            <div className="usamedic-footer">
              <img src="data:image/png;base64,__LOGO_B64__" alt="USAMEDIC · Médicos de Excelencia"/>
              <div className="tagline">Preparación Residentado Médico · ENAM · Internado</div>
              <div className="links">
                <a href="https://www.usamedic.pe">usamedic.pe</a> ·
                <a href="https://facebook.com/usamedic">Facebook</a> ·
                <a href="https://instagram.com/usamedic">Instagram</a> ·
                <a href="https://youtube.com/usamedic">YouTube</a>
              </div>
              <div className="sub">
                CIS-2.16 · Prevención Combinada VIH · Storytelling cinematográfico · Dreyfus N1+N2+N3
              </div>
            </div>
          </Slide>

        </div>
      </div>

      {showHint && (
        <div className="hint">← → o desliza para navegar · ↓ para leer más dentro de cada capítulo</div>
      )}

      <div className="bottom-nav">
        <button className="nav-arrow" onClick={() => go(idx - 1)} disabled={idx === 0} aria-label="Anterior">←</button>
        <div className="dots">
          {SCENES.map((s, i) => (
            <button key={i} className={`dot ${i === idx ? "active" : ""}`}
              onClick={() => go(i)} aria-label={s.label}>
              <span className="tip">{s.label}</span>
            </button>
          ))}
        </div>
        <button className="nav-arrow" onClick={() => go(idx + 1)} disabled={idx === total - 1} aria-label="Siguiente">→</button>
      </div>
    </Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
