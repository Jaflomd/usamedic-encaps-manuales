<style>
:root{

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050a15}
body{font-family:var(--font-body);color:#fff;line-height:1.65;font-weight:400}

.topbar{position:fixed;top:0;left:0;right:0;z-index:300;background:linear-gradient(135deg,rgba(29,202,211,.92) 0%,rgba(42,125,225,.92) 100%);color:#fff;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.25);backdrop-filter:blur(10px)}

.tagline-row{margin-top:22px;display:flex;flex-wrap:wrap;gap:7px}

.level-badge.n2{background:rgba(245,158,11,.3);color:#fde68a;border:1px solid rgba(245,158,11,.5)}

.callout.rule{border-left-color:var(--accent)}
.callout.trap{border-left-color:var(--danger);background:rgba(0,0,0,.42)}

.callout code{background:rgba(0,0,0,.4);padding:1px 7px;border-radius:5px;font-size:.85em;font-family:'SF Mono',Menlo,monospace}
.scene-content.dark-text .callout code{background:rgba(26,43,60,.08);color:var(--primary)}
.callout ul,.callout ol{margin:.3em 0;padding-left:1.3em}

.decision{background:rgba(0,0,0,.42);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px 24px;margin:20px 0;box-shadow:0 12px 36px rgba(0,0,0,.35)}

.decision .options{display:flex;flex-direction:column;gap:9px}
.decision .opt{text-align:left;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);padding:12px 16px;border-radius:11px;cursor:pointer;font-family:var(--font-body);font-size:.93rem;color:inherit;transition:.18s;font-weight:400;text-shadow:none}

.decision .feedback.ok{background:rgba(16,185,129,.2);border-left:4px solid var(--success)}
.decision .feedback.bad{background:rgba(239,68,68,.16);border-left:4px solid var(--danger)}
.scene-content.dark-text .decision .feedback.ok{background:rgba(16,185,129,.12)}
.scene-content.dark-text .decision .feedback.bad{background:rgba(239,68,68,.08)}

.scene-inner table{width:100%;border-collapse:collapse;margin:16px 0;font-family:var(--font-body);font-size:.88rem;border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);background:rgba(0,0,0,.3)}
.scene-content.dark-text table{background:rgba(255,255,255,.65)}
.scene-inner thead{background:linear-gradient(135deg,rgba(29,202,211,.5),rgba(42,125,225,.5))}
.scene-content.dark-text thead{background:linear-gradient(135deg,#1DCAD3,#2A7DE1)}
.scene-inner thead th{padding:10px 13px;text-align:left;font-weight:600;font-size:.78rem;letter-spacing:.5px;text-shadow:none}
.scene-content.dark-text thead th{color:#fff}
.scene-inner tbody td{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:400;vertical-align:top;text-shadow:none}
.scene-content.dark-text tbody td{border-color:rgba(26,43,60,.08)}
.scene-inner tbody tr:last-child td{border-bottom:none}

.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.rcard{padding:16px 12px;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(10px);transition:.25s}
.rcard:hover{transform:translateY(-3px);background:rgba(0,0,0,.4)}
.rcard .silhouette{width:38px;height:48px;margin:0 auto 7px}
.rcard .n{font-family:var(--font-brand);font-weight:700;font-size:.82rem;text-shadow:none}
.rcard .r{font-size:.68rem;opacity:.78;margin-top:2px;font-weight:300;text-shadow:none}

.qbank-q{margin-bottom:22px;padding:20px 22px;background:rgba(255,255,255,.55);border-radius:14px;border:1px solid rgba(26,43,60,.08);box-shadow:0 4px 12px rgba(26,43,60,.06)}
.qbank-q .stem{font-family:var(--font-display);font-weight:500;font-size:1rem;margin-bottom:12px;line-height:1.5}
.qbank-q .stem .num{font-weight:700;color:var(--primary);margin-right:5px}
.qbank-q .stem .star{color:var(--warning);margin-left:5px}
.qbank-q .options{display:flex;flex-direction:column;gap:9px;margin:10px 0 0}

.qbank-q .opt:hover:not(.locked){border-color:var(--secondary);background:rgba(29,202,211,.08);transform:translateX(3px)}
.qbank-q .opt.correct{border-color:var(--success);background:rgba(16,185,129,.18);color:#065f46;font-weight:500}
.qbank-q .opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.14);color:#991b1b;font-weight:500}
.qbank-q .opt.locked{cursor:default}
.qbank-q .feedback{margin-top:14px;padding:14px 16px;border-radius:10px;font-size:.9rem;line-height:1.6;animation:fadeUp .3s}
.qbank-q .feedback.ok{background:rgba(16,185,129,.12);border-left:4px solid var(--success);color:#065f46}
.qbank-q .feedback.bad{background:rgba(239,68,68,.08);border-left:4px solid var(--danger);color:#991b1b}
.qbank-q .meta-row{display:flex;justify-content:space-between;margin-top:10px;font-size:.72rem;opacity:.7;font-style:italic}

.rain-layer{position:absolute;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.raindrop{position:absolute;width:1.5px;height:48px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.45));animation:rain linear infinite}

.dots{display:flex;gap:9px;align-items:center;background:rgba(5,10,21,.55);padding:9px 15px;border-radius:999px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
.dots .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);border:none;cursor:pointer;padding:0;transition:.25s;position:relative}
.dots .dot.active{background:#fff;transform:scale(1.5);box-shadow:0 0 10px rgba(255,255,255,.5)}

.dots .dot .tip{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:rgba(5,10,21,.92);color:#fff;padding:4px 9px;border-radius:6px;font-size:.7rem;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-family:var(--font-body);font-weight:500}

.usamedic-footer{margin-top:24px;padding:24px 22px;background:rgba(5,10,21,.05);color:var(--dark);text-align:center;border-top:1px solid rgba(26,43,60,.1);border-radius:12px}

.usamedic-footer .sub{margin-top:14px;font-size:.66rem;opacity:.55;font-style:italic}

.hint{position:fixed;bottom:22px;left:22px;transform:none;background:rgba(5,10,21,.7);color:#fff;padding:7px 14px;border-radius:999px;font-size:.7rem;font-family:var(--font-body);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);z-index:140;animation:hintFade 5s ease-out forwards;pointer-events:none}
@keyframes hintFade{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}

@media (max-width:640px){
  .topbar{padding:8px 14px}
  .topbar .meta{display:none}
  .scene-content{padding:96px 20px 50px}

}
</style>

const Slide = ({ index, active, sky, mountainColors, foregroundColor, sun, withRain, withStars, withPeople, darkText, children }) => {
  const distantRef = useRef(null);
  const midRef = useRef(null);
  const nearRef = useRef(null);
  const foreRef = useRef(null);
  const sunRef = useRef(null);

  useEffect(() => {
    if (!active) return;
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      if (distantRef.current) distantRef.current.style.transform = `translate3d(${x * -8}px, ${y * -4}px, 0)`;
      if (midRef.current) midRef.current.style.transform = `translate3d(${x * -18}px, ${y * -8}px, 0)`;
      if (nearRef.current) nearRef.current.style.transform = `translate3d(${x * -30}px, ${y * -12}px, 0)`;
      if (foreRef.current) foreRef.current.style.transform = `translate3d(${x * -45}px, ${y * -18}px, 0)`;
      if (sunRef.current) sunRef.current.style.transform = `translate3d(${x * -4}px, ${y * -2}px, 0)`;
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, [active]);

  return (
    <section className={`slide ${active ? "active" : ""}`} data-index={index}>
      <div className="sky" style={{background: SKIES[sky]}}/>
      {sun && (
        <div ref={sunRef} className="celestial" style={{
          width: sun.size, height: sun.size,
          background: sun.color,
          top: sun.top, left: sun.left,
          boxShadow: sun.glow ? `0 0 ${sun.size * 0.7}px ${sun.color}66` : "none",
          opacity: sun.opacity || 1,
        }}/>
      )}
      {withStars && (
        <div className="stars-layer">
          {[...Array(70)].map((_, i) => (
            <span key={i} className="star" style={{
              top: `${Math.random()*65}%`, left: `${Math.random()*100}%`,
              animationDuration: `${2 + Math.random()*4}s`,
              animationDelay: `${Math.random()*3}s`,
              width: `${1 + Math.random()*1.5}px`,
              height: `${1 + Math.random()*1.5}px`,
            }}/>
          ))}
        </div>
      )}
      {withRain && (
        <div className="rain-layer">
          {[...Array(45)].map((_, i) => (
            <span key={i} className="raindrop" style={{
              left: `${Math.random()*100}%`,
              animationDuration: `${0.5 + Math.random()*0.7}s`,
              animationDelay: `${Math.random()*1.5}s`,

      <div ref={foreRef} className="layer fore"><Foreground color={foregroundColor} withPeople={withPeople}/></div>
      <div className={`scene-content ${darkText ? "dark-text" : ""}`}>
        <div className="scene-inner">{children}</div>
      </div>
    </section>
  );
};

const Decision = ({ question, options, correct, explainOk, explainBad }) => {
  const [picked, setPicked] = useState(null);
  return (
    <div className="decision">
      <p className="q">{question}</p>
      <div className="options">
        {options.map((o, i) => {
          let cls = "opt";
          if (picked !== null) {
            cls += " locked";
            if (i === correct) cls += " correct";
            else if (i === picked) cls += " wrong";
          }
          return (
            <button key={i} className={cls}
              onClick={() => picked === null && setPicked(i)}>
              <strong>{String.fromCharCode(65 + i)}.</strong> {o}
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`feedback ${picked === correct ? "ok" : "bad"}`}>
          {picked === correct ? explainOk : explainBad}
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [idx, setIdx] = useState(0);
  const [showHint, setShowHint] = useState(true);
  const total = SCENES.length;
  const touchStart = useRef(null);

  const go = (n) => {
    const next = Math.max(0, Math.min(total - 1, n));
    if (next !== idx) {
      setIdx(next);
      requestAnimationFrame(() => {
        document.querySelectorAll(".scene-content").forEach(el => el.scrollTop = 0);
      });
    }
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(idx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
      else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(total - 1); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [idx]);

  useEffect(() => {
    const t = setTimeout(() => setShowHint(false), 5000);
    return () => clearTimeout(t);
  }, []);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current === null) return;
    const delta = e.changedTouches[0].clientX - touchStart.current;
    if (Math.abs(delta) > 60) {
      if (delta < 0) go(idx + 1); else go(idx - 1);
    }
    touchStart.current = null;
  };

  return (
    <Fragment>
      <div className="counter">{String(idx + 1).padStart(2,"0")} / {String(total).padStart(2,"0")} · {SCENES[idx].label}</div>

            </p>
            <table>
              <thead><tr><th>Concepto NT</th><th>Definición operativa</th></tr></thead>
              <tbody>
                <tr><td><strong>Pertinencia intercultural</strong></td><td>Construcción dialogada, bidireccional, entre personal y usuario sobre cómo recibir el servicio</td></tr>
                <tr><td><strong>Adecuación cultural</strong></td><td>Servicios estructurados sobre la base de la cultura comunal</td></tr>
                <tr><td><strong>Agente de medicina tradicional</strong></td><td>Partera, huesero, hierbero, curandero, chamán, altomisayoc, yatiri</td></tr>
                <tr><td><strong>Casa de espera materna</strong></td><td>Albergue para gestantes &gt;2h del EESS, con huertos medicinales y actividades familiares</td></tr>
                <tr><td><strong>Plan de Parto</strong></td><td>Herramienta con 3 entrevistas (consultorio, domicilio, comunidad) que decide POSICIÓN del parto</td></tr>
              </tbody>
            </table>
            <Character who="luci" level="n2">
              <em>Cooperación, no concesión.</em> La pertinencia cultural no es ceder ante creencias no científicas. Es construir un espacio donde dos conocimientos cooperan para el mismo paciente.
            </Character>
            <div className="callout rule">
              <h4>Marco legal vigente</h4>
              <ul>
                <li><strong>DS 016-2016-SA</strong> — Política Sectorial de Salud Intercultural (corrige al DS 016-2009-SA)</li>
                <li><strong>Ley 29785</strong> + Convenio 169 OIT — Derecho de consulta previa</li>
                <li><strong>RM 594-2017-MINSA / CENSI</strong> — Normativa de pertinencia cultural en salud</li>
                <li><strong>NT Parto Vertical · RM 518-2016</strong> — Norma técnica vigente, aplica a TODOS los EESS</li>
                <li><strong>RM 638-2006/MINSA</strong> — Transversalización de DDHH, género e interculturalidad</li>
              </ul>
            </div>
          </Slide>

          {/* SLIDE 3 */}
          <Slide index={3} active={idx === 3} {...SCENES[3]}>
            <p className="eyebrow">Capítulo III · Las 7 dimensiones</p>
            <h1>Adecuación cultural <em>no es decoración</em></h1>
            <Character who="luci" level="n2">
              La NT Parto Vertical define 7 dimensiones (8 con participación) de adecuación.
              Si fallas en una, falla todo el sistema. La pared bonita no salva vidas.
            </Character>
            <table>
              <thead><tr><th>Dimensión</th><th>Lo que dice la NT</th></tr></thead>
              <tbody>
                <tr><td><strong>Infraestructura</strong></td><td>Sillas para parto vertical adaptadas a costumbres de la zona</td></tr>
                <tr><td><strong>Personal</strong></td><td>Capacitado en parto vertical; respeta costumbres</td></tr>
                <tr><td><strong>Idioma</strong></td><td>Material en lenguaje comprensible, respetuoso de la visión del mundo</td></tr>
                <tr><td><strong>Protocolos</strong></td><td>Permitir infusiones, ropa cultural, acompañante, posición elegida</td></tr>
                <tr><td><strong>Alimentación</strong></td><td>Permitir alimentos/líquidos azucarados e infusiones según costumbres</td></tr>
                <tr><td><strong>Vestimenta</strong></td><td>Respetar ropa según costumbres u ofrecer ropa adaptada</td></tr>
                <tr><td><strong>Acompañamiento</strong></td><td>Persona afectivamente relacionada (aumenta oxitocina, neutraliza adrenalina)</td></tr>
                <tr><td><strong>Participación</strong></td><td>Plan de Parto con 3 entrevistas (consultorio, domicilio, comunidad)</td></tr>
              </tbody>
            </table>
            <Character who="norma" level="n3">
              NT Parto Vertical, p. 45: "Camillas adaptadas a parto vertical, sillas para parto con enfoque intercultural <em>de acuerdo a las costumbres de la zona</em>". Lo que define la pertinencia es uso del servicio y satisfacción del usuario — no la decoración.
            </Character>
            <div className="callout gold">
              <h4>Convergencia inesperada</h4>
              <p>Lo que las comunidades indígenas practicaban — posición vertical, no rasurado, infusiones, acompañamiento — resulta ser lo que la evidencia biomédica recomienda. La NT Parto Vertical reconoce explícitamente esta convergencia.</p>
            </div>
          </Slide>

          {/* SLIDE 4 */}
          <Slide index={4} active={idx === 4} {...SCENES[4]}>
            <p className="eyebrow">Capítulo IV · La partera entra</p>
            <h1>Co-construir, <em>no autorizar</em></h1>
            <p className="narration">
              Mama Felicia se acerca al biombo. Pregunta si puede traer su <em>chumpi</em> tejido para que Rosa
              se apoye. Pregunta si pueden poner un mate de muña tibio. Pregunta dónde van a poner la placenta
              después.
            </p>
            <Character who="partera">
              Doctorcito, en mi tiempo ningún wawita nacía echado. Las mujeres se agarraban del chumpi. Si la dejas en la silla, va a ir bien. Yo le traduzco lo que tú quieras decir.
            </Character>
            <Character who="serums">
              Confirmas criterios: término (39 sem), bajo riesgo (sin comorbilidades, sin antecedente de cesárea), presentación cefálica. <em>Cumple para parto vertical.</em>
            </Character>
            <Character who="luci" level="n2">
              Antes del ingreso a centro obstétrico, la partera debe lavarse las manos (NT, p. 21). La partera <em>no reemplaza</em> el monitoreo clínico — lo facilita como intérprete y acompañante reconocida.
            </Character>
            <Decision
              question="Rosa entra en fase activa. La partera quiere darle muña tibia. ¿Tu conducta?"
              options={[
                "Prohibir cualquier infusión por riesgo de broncoaspiración.",
                "Permitir la muña tras preguntar composición (descartar uterotónicos peligrosos como ruda); aplicar partograma OMS desde 4 cm; FCF cada 30 min en fase activa.",
                "Permitir todo lo que la partera proponga sin verificar.",
                "Suspender el parto vertical porque la partera está interfiriendo con el protocolo.",
              ]}
              correct={1}
              explainOk="Correcto. La NT permite infusiones azucaradas o de hierbas de acuerdo a sus costumbres (p. 22). Anexo 9 de la NT lista hierbas usadas en parto para conocimiento del profesional. Vigilancia clínica obligatoria: partograma OMS desde 4 cm, FCF c/30 min en fase activa, c/5 min en expulsivo (NT, p. 19)."
              explainBad="Pertinencia cultural ≠ ausencia de criterio clínico. Ni prohibición total ni permisión total. La NT exige preguntar sobre 'ingesta de alguna infusión y prácticas propias de la localidad' (p. 19) y descartar uterotónicos peligrosos. Después, integrar."
            />
          </Slide>

          {/* SLIDE 5 */}
          <Slide index={5} active={idx === 5} {...SCENES[5]}>
            <p className="eyebrow">Capítulo V · Lo que la NT prohíbe</p>
            <h1>Los seis procedimientos <em>perjudiciales</em></h1>
            <Character who="luci" level="n2">
              La NT Parto Vertical declara expresamente 6 procedimientos como <em>perjudiciales</em>.
              No son "tradicionales viejos": son los que muchos EESS aún hacen de rutina.
            </Character>
            <table>
              <thead><tr><th>Práctica</th><th>Por qué es perjudicial</th></tr></thead>
              <tbody>
                <tr><td>Rasurado púbico</td><td>Sin beneficio clínico; genera incomodidad y pudor</td></tr>
                <tr><td>Decúbito dorsal en expulsivo</td><td>Menor eficacia de contracciones, mayor compresión de vasos</td></tr>
                <tr><td>Episiotomía de rutina</td><td>No reduce complicaciones; aumenta dolor y morbilidad</td></tr>
                <tr><td>Enema en trabajo de parto</td><td>Sin beneficio clínico; genera rechazo cultural</td></tr>
                <tr><td>Pujo forzado pre-expulsivo</td><td>No acelera el parto; puede causar daño</td></tr>
                <tr><td>Restricción de alimentos/líquidos</td><td>Aumenta riesgo de deshidratación y agotamiento</td></tr>
              </tbody>
            </table>
            <div className="callout trap">
              <h4>Trampas clásicas del examen</h4>
              <ul>
                <li><strong>"Restringir líquidos es protocolo médico"</strong> → No. NT, p. 22: práctica PERJUDICIAL.</li>
                <li><strong>"Rasurado es necesario para asepsia"</strong> → No. NT, p. 22: práctica PERJUDICIAL.</li>
                <li><strong>"Episiotomía siempre en nulípara"</strong> → No: solo selectiva. Rutinaria = perjudicial.</li>
                <li><strong>"Una sala intercultural ya cumple"</strong> → No: la pertinencia abarca 7-8 dimensiones, no solo infraestructura.</li>
              </ul>
            </div>
            <Character who="norma" level="n3">
              Pepa clave: la <em>evidencia biomédica</em> y la <em>pertinencia cultural</em> convergen en estos 6 puntos. Lo que las comunidades practicaban resulta ser lo que la ciencia recomienda. NT Parto Vertical, p. 22.
            </Character>
          </Slide>

          {/* SLIDE 6 */}
          <Slide index={6} active={idx === 6} {...SCENES[6]}>
            <p className="eyebrow">Capítulo VI · Las trampas del relativismo</p>
            <h1>Cultura <em>no significa</em> daño</h1>
            <p className="narration">
              Esa noche piensas en lo que casi pasa, y en lo que pudo haber salido mal por el otro lado.
              La pertinencia cultural tiene su propio set de errores.
            </p>
            <div className="callout trap">
              <h4>Trampa 1: relativismo total</h4>
              <p>"Las prácticas culturales son siempre seguras." → No. La NT pide preguntar sobre ingesta de infusiones (p. 19). Algunas hierbas son uterotónicas (ruda, matico) y pueden causar contracciones prematuras o sufrimiento fetal. Hay que evaluar caso a caso.</p>
            </div>
            <div className="callout trap">
              <h4>Trampa 2: imposición total</h4>
              <p>"Solo lo que dice el protocolo biomédico." → Refuerza primera demora. Si Rosa siente que en el EESS la van a humillar, parirá en su casa con riesgo. La cobertura de parto institucional en zonas andinas dependió de la adecuación: subió 20-30 puntos.</p>
            </div>
            <div className="callout rule">
              <h4>El criterio experto (Trade-off)</h4>
              <ol>
                <li>¿La práctica cultural es <em>inocua o beneficiosa</em>? → Validar e integrar (acompañamiento, vestimenta, infusiones inocuas, masoterapia).</li>
                <li>¿Tiene <em>riesgo potencial</em>? → Dialogar y negociar, no prohibir sin explicación (plantas uterotónicas).</li>
                <li>¿Tiene <em>riesgo grave inminente</em>? → Actuar clínicamente y explicar con respeto.</li>
              </ol>
            </div>
            <Character who="luci" level="n3">
              <em>Bottleneck Analysis:</em> Si la sala intercultural sube parto institucional de 65% a 85% pero la mortalidad materna no cambia, no significa que la pertinencia "no sirve". Significa que ahora son visibles otras demoras (calidad clínica, referencia oportuna) que también deben abordarse.
            </Character>
          </Slide>

          {/* SLIDE 7 */}
          <Slide index={7} active={idx === 7} {...SCENES[7]}>
            <p className="eyebrow">Cierre · 14 horas después</p>
            <h1>Rosa pare en cuclillas. <em>El sistema aprendió.</em></h1>
            <p className="narration">
              Rosa pare a las 14:42 en posición vertical, agarrada del chumpi de Mama Felicia.
              Bebé varón, 3,180 g, APGAR 9/10. Pinzamiento tardío. La placenta sale completa
              en 11 minutos. Le pides a Rosa qué hacer con ella; te dice que su mamá la enterrará
              junto al maíz. Lo firmas en la historia clínica.
            </p>
            <p className="narration">
              Tres semanas después, redactas con la obstetra el primer Plan de Parto del año:
              tres entrevistas, una en el consultorio, una en la casa de Rosa, una en la asamblea comunal.
              Cuatro gestantes se inscriben en la siguiente ronda. La microred autoriza una silla de parto
              vertical y un huerto de plantas medicinales detrás de la posta.
            </p>
            <div className="callout gold">
              <h4>La regla de oro de la pertinencia cultural</h4>
              <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:"1.05rem"}}>
                La pertinencia cultural es estrategia de acceso, no concesión decorativa. Cooperación entre conocimientos, no relativismo.
              </p>
              <table style={{marginTop:"12px"}}>
                <thead><tr><th>Sin pertinencia</th><th>Con pertinencia</th></tr></thead>
                <tbody>
                  <tr><td>Parto institucional 55-65% en zonas andinas</td><td>75-85% (+20-30 pts)</td></tr>
                  <tr><td>40% de muerte materna por no llegar al EESS</td><td>Primera demora reducida</td></tr>
                  <tr><td>Paciente no regresa por trato</td><td>Paciente refiere a familiares</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"12px",fontStyle:"italic"}}>
                Cada Plan de Parto co-construido = una primera demora menos. Cada partera reconocida = un puente entre dos saberes.
              </p>
            </div>
          </Slide>

          {/* SLIDE 8 */}
          <Slide index={8} active={idx === 8} {...SCENES[8]}>
            <p className="eyebrow" style={{color:"var(--primary)"}}>Epílogo · Q-Bank ENAM</p>
            <h1>Seis preguntas, <em>en frío</em></h1>
            <p className="narration">
              Después de vivir el caso, las preguntas tienen otro peso. Resuelve. Recibes feedback inmediato con la norma exacta.
            </p>
            {QBANK.map((q, i) => <QBankItem key={i} q={q} idx={i} />)}
            <div className="callout">
              <h4>Reglas de seguridad para clase</h4>
              <ul>
                <li><code>source_gated</code>. No conviertas dosis, plazos o flujos en MCQ publicable sin claim aprobado contra fuente A (NT Parto Vertical RM 518-2016 · DS 016-2016-SA · Ley 29785 · RM 594-2017/CENSI).</li>
                <li>Distinguir DS 016-2016-SA (vigente, intercultural) de DS 016-2009-SA (no usar para interculturalidad).</li>
                <li>La NT Parto Vertical es la fuente normativa principal del tema y aplica a TODOS los EESS.</li>
              </ul>
            </div>
            <div className="usamedic-footer">
              <img src="data:image/png;base64,__LOGO_B64__" alt="USAMEDIC · Médicos de Excelencia"/>
              <div className="tagline">Preparación Residentado Médico · ENAM · Internado</div>
              <div className="links">
                <a href="https://www.usamedic.pe">usamedic.pe</a> ·
                <a href="https://facebook.com/usamedic">Facebook</a> ·
                <a href="https://instagram.com/usamedic">Instagram</a> ·
                <a href="https://youtube.com/usamedic">YouTube</a>
              </div>
              <div className="sub">
                EI-2.3 · Atención intercultural · Storytelling cinematográfico · Dreyfus N1+N2+N3 · 2026-05-27
              </div>
            </div>
          </Slide>

        </div>
      </div>

      {showHint && (
        <div className="hint">← → o desliza para navegar · ↓ para leer más dentro de cada capítulo</div>
      )}

      <div className="bottom-nav">
        <button className="nav-arrow" onClick={() => go(idx - 1)} disabled={idx === 0} aria-label="Anterior">←</button>
        <div className="dots">
          {SCENES.map((s, i) => (
            <button key={i} className={`dot ${i === idx ? "active" : ""}`}
              onClick={() => go(i)} aria-label={s.label}>
              <span className="tip">{s.label}</span>
            </button>
          ))}
        </div>
        <button className="nav-arrow" onClick={() => go(idx + 1)} disabled={idx === total - 1} aria-label="Siguiente">→</button>
      </div>
    </Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
