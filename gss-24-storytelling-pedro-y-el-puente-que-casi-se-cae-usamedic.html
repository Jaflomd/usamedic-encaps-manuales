<style>

.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.rcard{padding:16px 12px;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(10px);transition:.25s}

.qbank-q{margin-bottom:22px;padding:20px 22px;background:rgba(255,255,255,.55);border-radius:14px;border:1px solid rgba(26,43,60,.08);box-shadow:0 4px 12px rgba(26,43,60,.06)}

const Slide = ({ index, active, sky, mountainColors, foregroundColor, sun, withRain, withStars, withPeople, darkText, children }) => {
  const distantRef = useRef(null);
  const midRef = useRef(null);
  const nearRef = useRef(null);
  const foreRef = useRef(null);
  const sunRef = useRef(null);

  useEffect(() => {
    if (!active) return;
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      if (distantRef.current) distantRef.current.style.transform = `translate3d(${x * -8}px, ${y * -4}px, 0)`;
      if (midRef.current) midRef.current.style.transform = `translate3d(${x * -18}px, ${y * -8}px, 0)`;
      if (nearRef.current) nearRef.current.style.transform = `translate3d(${x * -30}px, ${y * -12}px, 0)`;
      if (foreRef.current) foreRef.current.style.transform = `translate3d(${x * -45}px, ${y * -18}px, 0)`;
      if (sunRef.current) sunRef.current.style.transform = `translate3d(${x * -4}px, ${y * -2}px, 0)`;
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, [active]);

  return (
    <section className={`slide ${active ? "active" : ""}`} data-index={index}>
      <div className="sky" style={{background: SKIES[sky]}}/>
      {sun && (
        <div ref={sunRef} className="celestial" style={{
          width: sun.size, height: sun.size,
          background: sun.color,
          top: sun.top, left: sun.left,
          boxShadow: sun.glow ? `0 0 ${sun.size * 0.7}px ${sun.color}66` : "none",
          opacity: sun.opacity || 1,

      )}
      {withStars && (
        <div className="stars-layer">
          {[...Array(70)].map((_, i) => (
            <span key={i} className="star" style={{
              top: `${Math.random()*65}%`, left: `${Math.random()*100}%`,

            }}/>
          ))}
        </div>
      )}
      {withRain && (
        <div className="rain-layer">
          {[...Array(45)].map((_, i) => (
            <span key={i} className="raindrop" style={{
              left: `${Math.random()*100}%`,
              animationDuration: `${0.5 + Math.random()*0.7}s`,

      <div className={`scene-content ${darkText ? "dark-text" : ""}`}>

};

const Decision = ({ question, options, correct, explainOk, explainBad }) => {
  const [picked, setPicked] = useState(null);
  return (
    <div className="decision">
      <p className="q">{question}</p>
      <div className="options">
        {options.map((o, i) => {
          let cls = "opt";
          if (picked !== null) {
            cls += " locked";
            if (i === correct) cls += " correct";
            else if (i === picked) cls += " wrong";
          }
          return (
            <button key={i} className={cls}
              onClick={() => picked === null && setPicked(i)}>
              <strong>{String.fromCharCode(65 + i)}.</strong> {o}
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`feedback ${picked === correct ? "ok" : "bad"}`}>
          {picked === correct ? explainOk : explainBad}
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [idx, setIdx] = useState(0);
  const [showHint, setShowHint] = useState(true);
  const total = SCENES.length;
  const touchStart = useRef(null);

  const go = (n) => {
    const next = Math.max(0, Math.min(total - 1, n));
    if (next !== idx) {
      setIdx(next);
      requestAnimationFrame(() => {
        document.querySelectorAll(".scene-content").forEach(el => el.scrollTop = 0);
      });
    }
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(idx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
      else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(total - 1); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [idx]);

  useEffect(() => {
    const t = setTimeout(() => setShowHint(false), 5000);
    return () => clearTimeout(t);
  }, []);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current === null) return;
    const delta = e.changedTouches[0].clientX - touchStart.current;
    if (Math.abs(delta) > 60) {
      if (delta < 0) go(idx + 1); else go(idx - 1);
    }
    touchStart.current = null;
  };

  return (
    <Fragment>
      <div className="counter">{String(idx + 1).padStart(2,"0")} / {String(total).padStart(2,"0")} · {SCENES[idx].label}</div>

              <thead><tr><th>Concepto</th><th>Dirección</th><th>Quién lo emite</th></tr></thead>
              <tbody>
                <tr><td><strong>Referencia</strong></td><td>ORIGEN → mayor nivel</td><td>EESS de origen (tú, ahora)</td></tr>
                <tr><td><strong>Contrarreferencia</strong></td><td>DESTINO → regresa al origen</td><td>EESS de mayor nivel, una vez "mejorado"</td></tr>
                <tr><td><strong>Formato de referencia</strong></td><td>Acompaña al paciente</td><td>Documento legal de la transferencia</td></tr>
                <tr><td><strong>REFCON</strong></td><td>Sistema informático MINSA</td><td>Registra todas las referencias</td></tr>
              </tbody>
            </table>
            <Character who="luci" level="n2">
              <em>Puente.</em> La referencia es el puente entre niveles. Si el puente falla, el paciente queda en el aire entre dos sistemas — sin diagnóstico definitivo en origen, sin atención iniciada en destino.
            </Character>
            <div className="callout rule">
              <h4>Marco normativo</h4>
              <ul>
                <li><strong>NTS 018-MINSA/DGSP-V.01</strong> — Norma técnica del sistema de referencia y contrarreferencia (referencia principal del tema).</li>
                <li><strong>RM 751-2004-MINSA</strong> — Aprueba la NTS 018-V.01.</li>
                <li><strong>REFCON</strong> — Sistema informático nacional MINSA para registro y trazabilidad.</li>
              </ul>
            </div>
          </Slide>

          {/* SLIDE 3 */}
          <Slide index={3} active={idx === 3} {...SCENES[3]}>
            <p className="eyebrow">Capítulo III · 6 pasos sin saltar uno</p>
            <h1>El proceso, <em>tal cual</em></h1>
            <Character who="luci" level="n2">
              La NTS 018 ordena 6 pasos. El error más común es <em>saltar el paso 3</em> (comunicación previa).
              Es como llegar a una reunión sin avisar: el anfitrión no está preparado.
            </Character>
            <table>
              <thead><tr><th>Paso</th><th>Acción</th><th>Error típico</th></tr></thead>
              <tbody>
                <tr><td><strong>1. Identificación</strong></td><td>Reconocer que el caso supera la capacidad resolutiva</td><td>Referir todo / no referir lo que se debe</td></tr>
                <tr><td><strong>2. Estabilización</strong></td><td>Vía aérea, vía venosa, signos vitales, analgesia</td><td>Referir sin estabilizar</td></tr>
                <tr><td><strong>3. Comunicación</strong></td><td>Llamar al EESS de destino ANTES del traslado</td><td>No comunicar — llega sin aviso</td></tr>
                <tr><td><strong>4. Documentación</strong></td><td>Formato completo y legible</td><td>Formato incompleto o ilegible</td></tr>
                <tr><td><strong>5. Transporte</strong></td><td>Ambulancia con equipo mínimo en ruta</td><td>Transporte inadecuado al nivel de urgencia</td></tr>
                <tr><td><strong>6. Seguimiento</strong></td><td>Verificar llegada, registrar en REFCON</td><td>No saber si llegó</td></tr>
              </tbody>
            </table>
            <Character who="norma" level="n3">
              NTS 018-V.01: "Sin estabilización no hay traslado seguro; sin comunicación no hay preparación; sin documentación no hay transferencia de responsabilidad clínica; sin seguimiento no hay sistema."
            </Character>
          </Slide>

          {/* SLIDE 4 */}
          <Slide index={4} active={idx === 4} {...SCENES[4]}>
            <p className="eyebrow">Capítulo IV · 13:47 · ya hablaste</p>
            <h1>La llamada que cambia <em>todo</em></h1>
            <p className="narration">
              Lourdes prepara dos vías de Hartmann y oxígeno. Tú llamas al II-1. El residente de cirugía
              contesta al tercer timbrazo. Sabes exactamente qué decirle, en este orden:
            </p>
            <div className="callout rule">
              <h4>Guion de la llamada al destino</h4>
              <ol>
                <li><strong>Quién eres:</strong> "Soy el SERUMS del EESS I-3 Pampacolca."</li>
                <li><strong>Qué paciente:</strong> "Varón 47 años, abdomen agudo quirúrgico — apendicitis perforada probable, 12h de evolución."</li>
                <li><strong>Estado:</strong> "Inestable: TA 95/60, FC 118, fiebre 38.7, defensa peritoneal, vómitos."</li>
                <li><strong>Qué hice:</strong> "Estabilizo con cristaloides, analgesia, antibiótico empírico, NPO."</li>
                <li><strong>Cuándo llego:</strong> "Salimos en ambulancia ahora — 2 horas estimadas."</li>
                <li><strong>Qué necesito:</strong> "Confirmen cama de cirugía, sangre disponible, quirófano listo."</li>
              </ol>
            </div>
            <Character who="serums">
              El residente confirma. Mientras manejas el llenado del formato, Lourdes inicia el antibiótico. Sales en 15 minutos.
            </Character>
            <Decision
              question="El formato de referencia para Pedro DEBE incluir, según la NTS 018:"
              options={[
                "Solo nombre, DNI y motivo.",
                "Datos del paciente, EESS de origen y destino, motivo, resumen clínico, condición al momento de la referencia, tipo de referencia (emergencia), firma y sello del médico y del jefe del EESS.",
                "Solo el resumen clínico; el resto se completa en el destino.",
                "Datos del paciente y la firma del paciente autorizando el traslado.",
              ]}
              correct={1}
              explainOk="El formato exige: datos del paciente (nombre, DNI, edad, sexo, SIS/SOAT), EESS origen y destino, motivo, resumen clínico (historia, signos vitales, laboratorio, tratamiento iniciado), condición (estable/inestable + medidas de estabilización), tipo de referencia, firma y sello. NTS 018-MINSA/DGSP-V.01."
              explainBad="Un formato incompleto = transferencia incompleta de responsabilidad clínica. El médico receptor no sabe qué tratamiento se inició y arriesga duplicación o error. NTS 018-MINSA/DGSP-V.01."
            />
          </Slide>

          {/* SLIDE 5 */}
          <Slide index={5} active={idx === 5} {...SCENES[5]}>
            <p className="eyebrow">Capítulo V · Tipos I, II, III</p>
            <h1>El reloj <em>no es el mismo</em></h1>
            <Character who="luci" level="n2">
              No toda referencia es igual. La NTS 018 distingue tres tipos por criterio clínico.
              El reloj del traslado depende del tipo. Pedro es Tipo I.
            </Character>
            <table>
              <thead><tr><th>Tipo</th><th>Criterio clínico</th><th>Tiempo objetivo</th></tr></thead>
              <tbody>
                <tr><td><strong>Emergencia (I)</strong></td><td>Riesgo vital inminente; condición inestable</td><td>Inmediata; transporte en minutos</td></tr>
                <tr><td><strong>Urgencia (II)</strong></td><td>Estable pero puede deteriorarse; necesita atención en horas</td><td>Programable en horas (rango operativo: requiere fuente vigente)</td></tr>
                <tr><td><strong>Electiva (III)</strong></td><td>Problema que requiere nivel superior pero puede esperar días</td><td>Cita previa, días-semanas</td></tr>
              </tbody>
            </table>
            <div className="callout trap">
              <h4>Trampas clásicas</h4>
              <ul>
                <li><strong>Confundir urgencia con emergencia</strong> → cambia la prioridad y los recursos asignados.</li>
                <li><strong>Referir como electiva un caso que se deteriora</strong> → llegada tardía al destino.</li>
                <li><strong>Pedir cita en electiva pero no avisar a paciente</strong> → no se presenta = sub-resolución.</li>
                <li><strong>Citar umbrales sin fuente</strong> → cifras como "&lt;30 min" o "&gt;70% contrarreferencia" requieren norma vigente exacta para uso en MCQ.</li>
              </ul>
            </div>
            <Character who="norma" level="n3">
              Indicadores generales del sistema: tasa de referencia (referencias/atenciones×100), pertinencia (referencias adecuadas/total×100), tasa de contrarreferencia (contrarreferencias/referencias×100). Sus umbrales operativos requieren fuente vigente para clave normativa.
            </Character>
          </Slide>

          {/* SLIDE 6 */}
          <Slide index={6} active={idx === 6} {...SCENES[6]}>
            <p className="eyebrow">Capítulo VI · 22:15 · estudias esa noche</p>
            <h1>Las ramas que <em>no te tocaron</em></h1>
            <p className="narration">
              Esa noche, Pedro ya está operado. Revisas las versiones del caso que pudieron pasar
              y la conducta que cada una pedía.
            </p>
            <div className="callout rule">
              <h4>Si la ambulancia no estaba (recursos cero)</h4>
              <p>Activar transporte alternativo (vehículo público o privado), mantener estabilización en ruta con personal de enfermería, comunicación radial continua con II-1 (teleinterconsulta si hay conectividad → GSS-2.7). Documentar el desvío. Nunca dejar al paciente esperando con riesgo vital.</p>
            </div>
            <div className="callout rule">
              <h4>Si el II-1 rechaza recibir (cama llena)</h4>
              <p>Coordinar inmediatamente con DISA/Red para identificar EESS alternativo del mismo o mayor nivel. La NTS 018 no permite "regresar al origen" un paciente inestable. Documentar el rechazo y el desvío en REFCON.</p>
            </div>
            <div className="callout trap">
              <h4>Errores que casi cometes</h4>
              <table>
                <thead><tr><th>Error</th><th>Corrección</th></tr></thead>
                <tbody>
                  <tr><td>Referir sin comunicar al destino</td><td>Comunicar siempre ANTES del traslado</td></tr>
                  <tr><td>Referir sin estabilizar</td><td>Estabilización es condición suficiente para sobrevivir el traslado</td></tr>
                  <tr><td>Formato incompleto o ilegible</td><td>Formato completo = transferencia completa de responsabilidad</td></tr>
                  <tr><td>No confirmar llegada</td><td>Verificar dentro de los 30-60 min siguientes al traslado</td></tr>
                  <tr><td>No usar la contrarreferencia</td><td>La contrarreferencia es la memoria del sistema</td></tr>
                </tbody>
              </table>
            </div>
            <Character who="luci" level="n3">
              Sistémico: una tasa de referencia del 25% en un I-3 sugiere sub-resolutividad — no se está resolviendo lo que el nivel debería resolver. Con buena capacitación y supervisión, el primer nivel resuelve mucho más de lo que parece.
            </Character>
          </Slide>

          {/* SLIDE 7 */}
          <Slide index={7} active={idx === 7} {...SCENES[7]}>
            <p className="eyebrow">Cierre · 8 días después</p>
            <h1>Llega la contrarreferencia. <em>El sistema cerró.</em></h1>
            <p className="narration">
              Pedro fue operado: apendicectomía + lavado. Estancia 5 días. El residente del II-1
              te llama el lunes — esta vez te llama él. La contrarreferencia trae diagnóstico final, tratamiento, indicaciones de seguimiento.
            </p>
            <p className="narration">
              Recibes a Pedro en consulta. Curación de herida cada 48h, retiro de puntos en día 10,
              alarmas claras: fiebre, dolor abdominal nuevo, secreción. Lo registras en REFCON.
              El expediente queda cerrado <em>en ambos lados del puente</em>.
            </p>
            <div className="callout gold">
              <h4>La regla de oro del sistema R/CR</h4>
              <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:"1.05rem"}}>
                Referencia sin contrarreferencia = puente sin lado de regreso. La trazabilidad NO es burocracia; es la única forma en que el primer nivel aprende qué pasó con su paciente y puede dar seguimiento.
              </p>
              <table style={{marginTop:"12px"}}>
                <thead><tr><th>Indicador</th><th>Qué mide</th></tr></thead>
                <tbody>
                  <tr><td>Tasa de referencia</td><td>Referencias / Atenciones × 100 (alto = sub-resolutividad)</td></tr>
                  <tr><td>Pertinencia</td><td>Referencias adecuadas / Total × 100</td></tr>
                  <tr><td>Tasa de contrarreferencia</td><td>Contrarreferencias / Referencias × 100</td></tr>
                  <tr><td>Oportunidad emergencia</td><td>% emergencias trasladadas en tiempo objetivo</td></tr>
                </tbody>
              </table>
              <p style={{marginTop:"12px",fontStyle:"italic"}}>
                Umbrales operativos exactos requieren fuente vigente para uso en MCQ clave.
              </p>
            </div>
          </Slide>

          {/* SLIDE 8 */}
          <Slide index={8} active={idx === 8} {...SCENES[8]}>
            <p className="eyebrow" style={{color:"var(--primary)"}}>Epílogo · Q-Bank ENAM</p>
            <h1>Seis preguntas, <em>en frío</em></h1>
            <p className="narration">
              Después de vivir el caso, las preguntas tienen otro peso. Resuelve. Recibes feedback inmediato con la norma exacta.
            </p>
            {QBANK.map((q, i) => <QBankItem key={i} q={q} idx={i} />)}
            <div className="callout">
              <h4>Reglas de seguridad para clase</h4>
              <ul>
                <li><code>source_gated · no_acronym</code>. No conviertas umbrales operativos (&lt;30 min, &gt;70%, etc.) en MCQ publicable sin fuente vigente exacta.</li>
                <li>Las definiciones y el proceso de 6 pasos vienen de la NTS 018-MINSA/DGSP-V.01 (RM 751-2004-MINSA).</li>
                <li>REFCON es el sistema informático nacional MINSA — no confundir con sistemas regionales o de seguros.</li>
              </ul>
            </div>
            <div className="usamedic-footer">
              <img src="data:image/png;base64,__LOGO_B64__" alt="USAMEDIC · Médicos de Excelencia"/>
              <div className="tagline">Preparación Residentado Médico · ENAM · Internado</div>
              <div className="links">
                <a href="https://www.usamedic.pe">usamedic.pe</a> ·
                <a href="https://facebook.com/usamedic">Facebook</a> ·
                <a href="https://instagram.com/usamedic">Instagram</a> ·
                <a href="https://youtube.com/usamedic">YouTube</a>
              </div>
              <div className="sub">
                GSS-2.4 · Referencia y contrarreferencia · Storytelling cinematográfico · Dreyfus N1+N2+N3 · 2026-05-27
              </div>
            </div>
          </Slide>

        </div>
      </div>

      {showHint && (
        <div className="hint">← → o desliza para navegar · ↓ para leer más dentro de cada capítulo</div>
      )}

      <div className="bottom-nav">
        <button className="nav-arrow" onClick={() => go(idx - 1)} disabled={idx === 0} aria-label="Anterior">←</button>
        <div className="dots">
          {SCENES.map((s, i) => (
            <button key={i} className={`dot ${i === idx ? "active" : ""}`}
              onClick={() => go(i)} aria-label={s.label}>
              <span className="tip">{s.label}</span>
            </button>
          ))}
        </div>
        <button className="nav-arrow" onClick={() => go(idx + 1)} disabled={idx === total - 1} aria-label="Siguiente">→</button>
      </div>
    </Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
